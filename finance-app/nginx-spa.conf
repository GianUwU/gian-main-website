server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    location /users/ {
        proxy_pass http://nodejs-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Remote-User $http_remote_user;
        proxy_set_header Remote-Groups $http_remote_groups;
        proxy_set_header Remote-Name $http_remote_name;
        proxy_set_header Remote-Email $http_remote_email;
    }

    location = /token {
        proxy_pass http://nodejs-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Remote-User $http_remote_user;
        proxy_set_header Remote-Groups $http_remote_groups;
        proxy_set_header Remote-Name $http_remote_name;
        proxy_set_header Remote-Email $http_remote_email;
    }

    location /transactions {
        proxy_pass http://finance-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Remote-User $http_remote_user;
        proxy_set_header Remote-Groups $http_remote_groups;
        proxy_set_header Remote-Name $http_remote_name;
        proxy_set_header Remote-Email $http_remote_email;
    }

    location /files {
        proxy_pass http://drop-backend:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Remote-User $http_remote_user;
        proxy_set_header Remote-Groups $http_remote_groups;
        proxy_set_header Remote-Name $http_remote_name;
        proxy_set_header Remote-Email $http_remote_email;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /uploads/ {
        proxy_pass http://drop-backend:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Remote-User $http_remote_user;
        proxy_set_header Remote-Groups $http_remote_groups;
        proxy_set_header Remote-Name $http_remote_name;
        proxy_set_header Remote-Email $http_remote_email;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /upload {
        proxy_pass http://drop-backend:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Remote-User $http_remote_user;
        proxy_set_header Remote-Groups $http_remote_groups;
        proxy_set_header Remote-Name $http_remote_name;
        proxy_set_header Remote-Email $http_remote_email;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/ {
        proxy_pass http://drop-backend:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Remote-User $http_remote_user;
        proxy_set_header Remote-Groups $http_remote_groups;
        proxy_set_header Remote-Name $http_remote_name;
        proxy_set_header Remote-Email $http_remote_email;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /storage-info {
        proxy_pass http://drop-backend:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Remote-User $http_remote_user;
        proxy_set_header Remote-Groups $http_remote_groups;
        proxy_set_header Remote-Name $http_remote_name;
        proxy_set_header Remote-Email $http_remote_email;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Content-Security-Policy "upgrade-insecure-requests";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}

